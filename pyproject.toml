[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "termharvest"
version = "0.1.0"
description = "Offline, read-only character-terminal screen harvesting pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
[project.optional-dependencies]
signing = ["cryptography>=41"]
test = ["pytest>=8.0", "cryptography>=41"]
[project.scripts]
termharvest = "termharvest.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
