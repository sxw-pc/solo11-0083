version: 1
fields:
  demo_customer:
    customer_id: {required: true, type: string, pattern: "^C[0-9]{5}$"}
    customer_name: {required: true, type: string}
    city: {required: true, type: string}
    status: {required: true, type: string, enum: [ACTIVE, SUSPENDED]}
    balance: {required: true, type: decimal, min: 0}
    credit_limit: {required: true, type: decimal, min: 0}
    period_start: {required: true, type: date, format: "%Y-%m-%d"}
    period_end: {required: true, type: date, format: "%Y-%m-%d"}
    mailing_address: {required: true, type: string}
    region_code: {required: true, type: string, pattern: "^[0-9]{2}$"}
  demo_bill_list:
    bill_id: {required: true, type: string, pattern: "^B[0-9]{6}$"}
    bill_date: {required: true, type: date, format: "%Y-%m-%d"}
    amount: {required: true, type: decimal, min: 0}
    status: {required: true, type: string, enum: [OPEN, PAID, VOID]}
record_checks:
  - {id: balance_within_credit_limit, screen_id: demo_customer, left: balance, op: lte, right_field: credit_limit, message: balance must not exceed credit_limit}
  - {id: period_starts_before_end, screen_id: demo_customer, left: period_start, op: lte, right_field: period_end, message: period_start must not be after period_end}
batch_checks:
  - {id: unique_customers, check: unique_key, screen_id: demo_customer, key: [customer_id]}
  - {id: unique_bills, check: unique_key, screen_id: demo_bill_list, key: [bill_id]}
  - {id: no_duplicate_bill_records, check: duplicate_record, screen_id: demo_bill_list}
  - {id: bill_list_not_empty, check: non_empty, screen_id: demo_bill_list, message: bill list extraction must not be empty}
  - {id: bill_total_matches_detail, check: sum_equals, screen_id: demo_bill_list, field: amount, fact: batch_total, tolerance: 0.001, message: bill detail sum must match BATCH TOTAL}
  - {id: bill_count_matches_footer, check: count_equals, screen_id: demo_bill_list, field: bill_id, fact: batch_count, message: extracted bill count must match BATCH COUNT}
